const SHARE_BASE = 'https://ie-trainer.app/#s=';
const b64 = (str) => btoa(unescape(encodeURIComponent(str))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const unb64 = (str) => decodeURIComponent(escape(atob(str.replace(/-/g, '+').replace(/_/g, '/'))));
function shareLink(s) {
  const p = s.params;
  const compact = { v: 1, t: s.titre, o: s.objectif, c: s.critere, q: s.prerequis,
    p: [p.niveau, p.saison, p.milieu, p.philo, p.profil],
    f: PHASES.map((ph) => { const x = s.phases[ph.id]; return [x.duree, x.items.map((i) => i.exId), x.consignes, x.position]; }),
    u: [s.secu.surveillance, s.secu.protocoleSortie ? 1 : 0, s.secu.poss ? 1 : 0, s.secu.o2 ? 1 : 0] };
  const url = SHARE_BASE + b64(JSON.stringify(compact));
  return { url, len: url.length };
}
function parseShared(text) {
  const t = text.trim();
  if (!t) return null;
  try {
    if (t.startsWith('{')) { const o = JSON.parse(t); return o.phases ? { ...o, id: uid() } : null; }
    const raw = t.includes('#s=') ? t.split('#s=')[1] : t;
    const c = JSON.parse(unb64(raw.trim()));
    const s = newSession({ titre: c.t, objectif: c.o, critere: c.c, prerequis: c.q });
    [s.params.niveau, s.params.saison, s.params.milieu, s.params.philo, s.params.profil] = c.p;
    PHASES.forEach((ph, i) => { const [d, ids, cons, pos] = c.f[i]; s.phases[ph.id] = { duree: d, consignes: cons, position: pos, items: ids.filter(exOf).map((id) => ({ uid: uid(), exId: id })) }; });
    s.secu = { surveillance: c.u[0], protocoleSortie: !!c.u[1], poss: !!c.u[2], o2: !!c.u[3] };
    return s;
  } catch (e) { return null; }
}

  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { this.mem[k] = v; return false; } },
};

      ${PHASES.map((ph) => { const phs = s.phases[ph.id]; return html`<${Card} key=${ph.id} className="flex flex-col gap-3">

          <button type="button" className="flex-1 min-w-0 text-left" onClick=${() => setPick({ view: e })}><span className="font-semibold leading-5 block">${e.nom}</span>
            <span className="flex flex-wrap gap-1.5 mt-1.5"><${RisquePill} r=${e.risque} /><${OriginePills} ex=${e} /></span></button>

          <${Field} id=${'p-' + ph.id} label="Position de l’encadrant"><input id=${'p-' + ph.id} type="text" value=${phs.position} placeholder="Ex. À mi-bassin" onInput=${(e) => upd((x) => { x.phases[ph.id].position = e.target.value; })} /><//></div></details></${Card}>`; })}

    <${Sheet} open=${showAl} onClose=${() => setShowAl(false)} title="Sécurité de ta séance"><${AlertsList} list=${al} onAcc=${(a) => { setShowAl(false); setAcc(ACCIDENTS.find((x) => x.id === a || (a === 'SYN' && x.id === 'SYN'))); }} />
      <p className="text-[13px] text-mute">Les alertes aident à repérer les points sensibles ; elles ne valident jamais une séance.</p><//>
    <${Sheet} open=${!!acc} onClose=${() => setAcc(null)} title=${acc ? acc.nom : ''}>${acc && html`<${AccidentFiche} a=${acc} />`}<//></div>`;

/* ----- Catalogue ----- */
function Catalogue() {
  const [f, setF] = useState({ niveau: 'ALL', saison: 'ALL', milieu: 'ALL', disc: 'ALL', q: '' });
  const [sel, setSel] = useState(null);
  const discs = ['ALL', ...Array.from(new Set(EX.map((e) => e.disc)))];
  const list = EX.filter((e) => (f.niveau === 'ALL' || e.niveaux.includes(f.niveau)) && (f.saison === 'ALL' || e.saisons.includes(f.saison)) && (f.milieu === 'ALL' || e.milieux.includes(f.milieu)) && (f.disc === 'ALL' || e.disc === f.disc) && (!f.q || e.nom.toLowerCase().includes(f.q.toLowerCase())));
  const filt = (k, label, opts) => html`<${Field} id=${'f-' + k} label=${label}><select id=${'f-' + k} value=${f[k]} onChange=${(e) => setF({ ...f, [k]: e.target.value })}><option value="ALL">Tous</option>${Object.entries(opts).map(([v, o]) => html`<option key=${v} value=${v}>${o.label}</option>`)}</select><//>`;
  return html`<div className="flex flex-col gap-4 pb-6"><${PageHead} title="Exercices" sub=${list.length + ' exercice' + (list.length > 1 ? 's' : '') + ' · le pourquoi, la sécurité, les variantes'} />
    <${Card} className="flex flex-col gap-3"><input type="text" aria-label="Rechercher" placeholder="Rechercher un exercice" value=${f.q} onInput=${(e) => setF({ ...f, q: e.target.value })} />
      <div className="grid grid-cols-3 gap-2">${filt('niveau', 'Niveau', NIVEAUX)}${filt('saison', 'Saison', SAISONS)}${filt('milieu', 'Milieu', MILIEUX)}</div>
      <div className="flex flex-wrap gap-1.5" role="group" aria-label="Discipline">${discs.map((d) => html`<button key=${d} type="button" aria-pressed=${f.disc === d} onClick=${() => setF({ ...f, disc: d })} className=${cx('rounded-full px-3.5 py-2 text-[14px] font-semibold min-h-[40px]', f.disc === d ? 'bg-ink text-bg' : 'bg-soft text-ink')}>${d === 'ALL' ? 'Toutes' : d}</button>`)}</div></${Card}>
    ${list.length === 0 && html`<${Empty} icon="SearchX" title="Aucun exercice trouvé" text="Essaie d’élargir les filtres."><${Btn} variant="secondary" onClick=${() => setF({ niveau: 'ALL', saison: 'ALL', milieu: 'ALL', disc: 'ALL', q: '' })}>Réinitialiser les filtres<//><//>`}
    <ul className="flex flex-col gap-3">${list.map((e) => html`<li key=${e.id}><button type="button" onClick=${() => setSel(e)} className="w-full text-left rounded-2xl bg-card p-5 flex flex-col gap-2 hover:brightness-95">
      <span className="flex items-start justify-between gap-2"><span className="font-semibold text-lg leading-6">${e.nom}</span><${I.ChevronRight} size=${20} className="shrink-0 mt-0.5 text-mute" aria-hidden="true" /></span>
      <span className="flex flex-wrap gap-1.5"><${RisquePill} r=${e.risque} /><${Pill}>${e.disc}<//><${OriginePills} ex=${e} /></span></button></li>`)}</ul>
    <${Sheet} open=${!!sel} onClose=${() => setSel(null)} title=${sel ? sel.nom : ''}>${sel && html`<${ExFiche} ex=${sel} />`}<//></div>`;
}

/* ----- Carnet ----- */
function Carnet({ data, actions }) {

  if (!carnet) return html`<div className="flex flex-col gap-4 pb-6"><${PageHead} title="Carnet IE" sub="10 séances encadrées, une progression logique" />
    <${Card} className="flex flex-col gap-4"><p className="text-body leading-6">Le carnet lie exactement 10 séances dans l’ordre. Tu vois d’une séance à l’autre ce qui est acquis, ce qui progresse, et si l’ensemble est cohérent pour le jury.</p>
      <${Field} id="ctitre" label="Titre du carnet"><input id="ctitre" type="text" value=${titre} onInput=${(e) => setTitre(e.target.value)} /><//>
      <${Field} id="cexam" label="Date de l’examen" hint="Les phases de saison se calent sur cette date"><input id="cexam" type="date" value=${exam} onInput=${(e) => setExam(e.target.value)} /><//>

      <${Btn} variant="secondary" icon="FlaskConical" onClick=${actions.loadExample}>Charger un exemple de 10 séances<//><//></div>`;
  const rows = carnetRows(carnet, seances), co = coherence(rows, carnet), filled = rows.filter((r) => r.s).length;
  const unassigned = seances.filter((s) => !carnet.slots.some((sl) => sl.seanceId === s.id));
  const phaseTone = { REPRISE: 'info', DEVELOPPEMENT: 'warn', PRE_EXAMEN: 'ink' };

  return html`<div className="flex flex-col gap-4 pb-6"><${PageHead} title=${carnet.titre} sub=${filled + ' séance' + (filled > 1 ? 's' : '') + ' sur 10 · examen le ' + fmtDate(carnet.examDate)} />
    <div className="grid grid-cols-2 gap-2 p-1 rounded-full bg-card" role="tablist">${[['slots', 'Emplacements'], ['coh', 'Cohérence']].map(([k, l]) => html`<button key=${k} role="tab" aria-selected=${tab === k} onClick=${() => setTab(k)} className=${cx('rounded-full py-2.5 font-semibold min-h-[44px]', tab === k ? 'bg-ink text-bg' : 'text-ink')}>${l}${k === 'coh' && co.filter((c) => c.niveau === 'avertissement').length > 0 ? ' · ' + co.filter((c) => c.niveau === 'avertissement').length : ''}</button>`)}</div>
    ${tab === 'slots' && html`<ol className="flex flex-col gap-3">${rows.map((r) => html`<li key=${r.i}><${Card} className="flex flex-col gap-3">
      <div className="flex items-center gap-3"><span className="display w-11 h-11 rounded-full bg-ink text-bg flex items-center justify-center text-lg tnum shrink-0">${r.rank}</span>
        <div className="flex-1 min-w-0"><input type="date" aria-label=${'Date de la séance ' + r.rank} value=${r.date} onInput=${(e) => actions.setSlot(r.i, { date: e.target.value })} /></div>
        ${r.phase && html`<${Pill} tone=${phaseTone[r.phase]}>${SAISONS[r.phase].label.split(' /')[0]}<//>`}</div>
      ${r.s ? html`<div className="flex flex-col gap-2"><p className="font-semibold leading-6">${r.s.titre || 'Séance sans titre'}</p>
        <div className="flex flex-wrap gap-1.5"><${Pill} icon="Activity">${DOMS[r.ind.dom]}<//><${Pill} icon="Waves">${r.ind.apnees} apnées<//><${RisquePill} r=${r.ind.risque || 1} /></div>
        <div className="flex flex-wrap gap-2"><${Btn} variant="tertiary" icon="FolderOpen" onClick=${() => actions.openBuilder(r.s.id)}>Ouvrir<//>
          <${IconBtn} icon="ChevronUp" label="Monter la séance" disabled=${r.i === 0} onClick=${() => actions.swapSlot(r.i, r.i - 1)} /><${IconBtn} icon="ChevronDown" label="Descendre la séance" disabled=${r.i === 9} onClick=${() => actions.swapSlot(r.i, r.i + 1)} />
          <${IconBtn} icon="Unlink" label="Retirer du carnet" onClick=${() => actions.setSlot(r.i, { seanceId: null })} /></div></div>`
      : html`<div className="flex flex-col gap-2"><${Btn} icon="Hammer" onClick=${() => actions.createSession(r.i)}>Construire cette séance<//>
        ${unassigned.length > 0 && html`<label className="flex flex-col gap-1.5"><span className="text-[14px] font-semibold">Ou lier une séance existante</span><select aria-label=${'Lier une séance à l’emplacement ' + r.rank} value="" onChange=${(e) => e.target.value && actions.setSlot(r.i, { seanceId: e.target.value })}><option value="">Choisir une séance</option>${unassigned.map((s) => html`<option key=${s.id} value=${s.id}>${s.titre || 'Séance sans titre'}</option>`)}</select></label>`}</div>`}</${Card}></li>`)}</ol>

        <${Btn} variant="ghost" icon="Trash2" onClick=${actions.deleteCarnet}>Supprimer ce carnet (les séances restent)<//></div>`}
    ${tab === 'coh' && html`<div className="flex flex-col gap-4">
      <${Card} className="flex flex-col gap-3"><h2 className="font-semibold text-lg">Progression des 10 séances</h2>

            <span className="text-[12px] font-semibold tnum">${r.rank}</span>

        <div className="flex flex-wrap gap-x-4 gap-y-1 text-[13px] text-body"><span className="flex items-center gap-1.5"><i className="inline-block w-3 h-3 rounded-sm" style=${{ background: 'var(--primary)' }}></i>Travail hypercapnique</span><span className="flex items-center gap-1.5"><i className="inline-block w-3 h-3 rounded-sm" style=${{ background: 'var(--line)' }}></i>Autres apnées</span><span>Pastille : niveau de risque 1 à 4</span></div>
        <div className="flex flex-wrap gap-x-3 gap-y-1 text-[12px] text-mute"><span>R : Reprise</span><span>D : Développement</span><span>P : Pré-compétition</span><span>Examen : ${fmtDate(carnet.examDate)}</span></div>
        <details><summary className="text-[14px] font-semibold">Voir les valeurs</summary><div className="overflow-x-auto mt-2"><table className="w-full text-[14px] tnum"><thead><tr className="text-left text-mute"><th className="py-1 pr-2">N°</th><th className="pr-2">Date</th><th className="pr-2">Dominante</th><th className="pr-2">Apnées</th><th className="pr-2">CO₂</th><th>Risque</th></tr></thead>
          <tbody>${rows.map((r) => html`<tr key=${r.i} className="border-t border-line"><td className="py-1 pr-2">${r.rank}</td><td className="pr-2">${fmtDate(r.date)}</td><td className="pr-2">${r.ind ? DOMS[r.ind.dom] : '—'}</td><td className="pr-2">${r.ind ? r.ind.apnees : '—'}</td><td className="pr-2">${r.ind ? r.ind.co2 : '—'}</td><td>${r.ind ? r.ind.risque : '—'}</td></tr>`)}</tbody></table></div></details></${Card}>
      <${Card} className="flex flex-col gap-3"><h2 className="font-semibold text-lg">Points de vigilance</h2>
        ${co.length === 0 ? html`<p className="rounded-xl bg-pale text-pos p-4 font-semibold">Aucun point de vigilance : ta progression paraît cohérente.</p>`
          : html`<ul className="flex flex-col gap-2">${co.map((c, i) => html`<li key=${i} className=${cx('rounded-xl p-4', c.niveau === 'avertissement' ? 'bg-warn-bg text-warn-ink' : 'bg-info-bg text-info-ink')}><p className="font-semibold">${c.titre}</p><p className="text-[15px] leading-6 mt-1">${c.texte}</p><p className="text-[13px] mt-1.5">${c.source} · ${c.statut === 'corpus' ? 'Corpus' : 'Suggestion, à valider'}</p></li>`)}</ul>`}
        <p className="text-[13px] text-mute leading-5">Ces points ne bloquent jamais : la progression reste ton jugement pédagogique. Les seuils sont des suggestions à valider.</p></${Card}>
      <${Card} className="flex flex-col gap-3"><h2 className="font-semibold text-lg">Pourquoi cet ordre</h2><p className="text-[14px] text-mute">Ta justification de la progression, à présenter au jury.</p>
        <textarea aria-label="Pourquoi cet ordre" className="!min-h-[140px]" value=${carnet.synthese} onInput=${(e) => actions.setCarnet({ synthese: e.target.value })} placeholder="Ex. Je pars du foncier et de la technique, je développe la tolérance au CO₂, puis j’introduis l’hypoxie à l’approche de l’examen."></textarea>
        <div className="flex gap-2 flex-wrap"><${Btn} variant="secondary" icon="Wand2" onClick=${() => actions.setCarnet({ synthese: draftSynthese(rows) })}>Générer un brouillon<//><${Btn} variant="tertiary" icon="Copy" onClick=${() => actions.copy(carnet.synthese, 'Texte copié')}>Copier<//></div></${Card}></div>`}</div>`;
}

/* ----- Plus ----- */
function Plus({ data, actions }) {
  const [imp, setImp] = useState(''), [conf, setConf] = useState(false), [acc, setAcc] = useState(null);
  const parsed = useMemo(() => parseShared(imp), [imp]);
  const size = JSON.stringify({ seances: data.seances, carnet: data.carnet }).length;
  const theme = () => { const r = document.documentElement; const d = r.getAttribute('data-theme') === 'dark' || (!r.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches); r.setAttribute('data-theme', d ? 'light' : 'dark'); };
  return html`<div className="flex flex-col gap-4 pb-6"><${PageHead} title="Plus" sub="Disclaimer, import, sauvegarde et fiches accidents" />
    <${Card} className="flex flex-col gap-3"><h2 className="font-semibold text-lg flex items-center gap-2"><${I.Info} size=${20} aria-hidden="true" /> À propos</h2><p className="text-body leading-6">${DISCLAIMER}</p>
      <p className="text-[14px] text-mute leading-5">Prototype : aucune donnée n’est envoyée nulle part. Les règles portent leur origine (corpus ou suggestion) ; seule la dernière version du MFA fait foi.</p><${Btn} variant="secondary" icon="SunMoon" onClick=${theme}>Changer de thème<//></${Card}>
    <${Card} className="flex flex-col gap-3"><h2 className="font-semibold text-lg flex items-center gap-2"><${I.Import} size=${20} aria-hidden="true" /> Importer une séance reçue</h2>
      <${Field} id="imp" label="Colle un lien ou un fichier de séance"><textarea id="imp" value=${imp} onInput=${(e) => setImp(e.target.value)} placeholder="https://ie-trainer.app/#s=… ou {…}"></textarea><//>
      ${imp.trim() && !parsed && html`<p className="rounded-xl bg-warn-bg text-warn-ink p-3 text-[15px]">On n’a pas pu lire cette séance. Demande à la personne de te la renvoyer.</p>`}
      ${parsed && html`<div className="rounded-xl bg-pale text-pos p-4"><p className="font-semibold">${parsed.titre || 'Séance sans titre'}</p><p className="text-[14px]">${NIVEAUX[parsed.params.niveau].label} · ${SAISONS[parsed.params.saison].label} · ${indicators(parsed).n} exercices</p></div>`}
      <${Btn} icon="Plus" disabled=${!parsed} onClick=${() => { actions.addSession(parsed); setImp(''); actions.toast('Séance ajoutée à Mes séances'); }}>Ajouter à mes séances<//></${Card}>
    <${Card} className="flex flex-col gap-3"><h2 className="font-semibold text-lg flex items-center gap-2"><${I.HardDrive} size=${20} aria-hidden="true" /> Données de cet appareil</h2>
      <p className="text-body leading-6">${data.seances.length} séance${data.seances.length > 1 ? 's' : ''}, ${data.carnet ? '1 carnet' : 'aucun carnet'}. Espace utilisé : <span className="tnum font-semibold">${(size / 1024).toFixed(1)} Ko</span> sur environ 5 000 Ko.</p>
      <p className="text-[14px] text-mute leading-5">Les données restent dans ce navigateur. Elles disparaissent si tu vides les données du site ou si tu changes d’appareil : exporte-les.</p>
      <${Btn} variant="tertiary" icon="FileJson" onClick=${() => actions.copy(JSON.stringify({ seances: data.seances, carnet: data.carnet }), 'Sauvegarde copiée')}>Copier toute ma sauvegarde<//>
      ${!conf ? html`<${Btn} variant="danger" icon="Trash2" onClick=${() => setConf(true)}>Effacer toutes mes données<//>`
        : html`<div className="rounded-xl bg-neg-bg text-neg-ink p-4 flex flex-col gap-3"><p className="font-semibold">Effacer définitivement ${data.seances.length} séance${data.seances.length > 1 ? 's' : ''} et le carnet ?</p><div className="flex gap-2"><${Btn} variant="tertiary" onClick=${() => setConf(false)}>Annuler<//><${Btn} variant="danger" className="!bg-neg-ink !text-bg" onClick=${() => { actions.resetAll(); setConf(false); }}>Effacer<//></div></div>`}</${Card}>
    <${Card} className="flex flex-col gap-3"><h2 className="font-semibold text-lg flex items-center gap-2"><${I.Siren} size=${20} aria-hidden="true" /> Fiches accidents</h2>
      <p className="text-[14px] text-mute">Format de l’examen. Seules la PCM et la syncope sont détaillées dans les documents sources ; les autres accidents sont à compléter.</p>
      ${ACCIDENTS.map((a) => html`<${Btn} key=${a.id} variant="secondary" icon="FileText" className="!justify-start" onClick=${() => setAcc(a)}>${a.nom}<//>`)}
      <p className="rounded-xl bg-warn-bg text-warn-ink p-3 text-[14px]">Barotraumatismes, hypercapnie, noyade : à compléter avec le MFA ou la CRA.</p></${Card}>
    <${Sheet} open=${!!acc} onClose=${() => setAcc(null)} title=${acc ? acc.nom : ''}>${acc && html`<${AccidentFiche} a=${acc} />`}<//></div>`;
}

/* ============================================================================
   APPLICATION
   ============================================================================ */
const TABS = [['seances', 'Séances', 'ClipboardList'], ['carnet', 'Carnet', 'BookMarked'], ['exercices', 'Exercices', 'Dumbbell'], ['plus', 'Plus', 'Menu']];
const hashTab = () => { const h = (location.hash || '').replace('#', ''); return TABS.some((t) => t[0] === h) ? h : 'seances'; };

function App() {
  const init = useMemo(() => store.get(SKEY, null), []);
  const [seances, setSeances] = useState(init ? init.seances || [] : []);
  const [carnet, setCarnet] = useState(init ? init.carnet || null : null);
  const [prefs, setPrefs] = useState(init ? init.prefs || {} : {});
  const [storageOk, setStorageOk] = useState(true);
  const [tab, setTab] = useState(hashTab());
  const [building, setBuilding] = useState(null);
  const [toastMsg, setToastMsg] = useState(null);
  const [disclaimerOk, setDisclaimerOk] = useState(() => (store.get(DKEY, null) || {}).v === DISCLAIMER_VERSION);
  const tRef = useRef(null);

  useEffect(() => { const f = () => { setTab(hashTab()); setBuilding(null); }; window.addEventListener('hashchange', f); return () => window.removeEventListener('hashchange', f); }, []);
  useEffect(() => { setStorageOk(store.set(SKEY, { seances, carnet, prefs })); }, [seances, carnet, prefs]);

  const toast = useCallback((msg, action) => { setToastMsg({ msg, action }); clearTimeout(tRef.current); tRef.current = setTimeout(() => setToastMsg(null), 6000); }, []);
  const copy = (txt, msg) => { try { navigator.clipboard.writeText(txt).then(() => toast(msg), () => toast('Copie impossible ici : utilise le menu Partager.')); } catch (e) { toast('Copie impossible ici.'); } };
  const clone = (o) => JSON.parse(JSON.stringify(o));

  const actions = {
    toast, copy,
    setPref: (k, v) => setPrefs((p) => ({ ...p, [k]: v })),
    createSession: (slotIdx) => {
      const s = newSession();
      if (typeof slotIdx === 'number' && carnet) { const ph = phaseOfDate(carnet.slots[slotIdx].date, carnet.examDate); if (ph) s.params.saison = ph; if (ph === 'DEVELOPPEMENT' || ph === 'PRE_EXAMEN') s.params.niveau = 'ACEL'; }
      setSeances((a) => [s, ...a]);
      if (typeof slotIdx === 'number') setCarnet((c) => ({ ...c, slots: c.slots.map((sl, i) => (i === slotIdx ? { ...sl, seanceId: s.id } : sl)) }));
      setBuilding(s.id);
    },
    addSession: (s) => setSeances((a) => [{ ...s, id: uid(), updatedAt: Date.now() }, ...a]),
    openBuilder: (id) => setBuilding(id),
    updateSession: (id, fn) => setSeances((a) => a.map((s) => { if (s.id !== id) return s; const n = clone(s); fn(n); n.updatedAt = Date.now(); if (n.statut === 'prete') n.statut = 'prete'; return n; })),
    duplicate: (id) => setSeances((a) => { const s = a.find((x) => x.id === id); const c = clone(s); c.id = uid(); c.titre = (s.titre || 'Séance') + ' (copie)'; c.statut = 'brouillon'; c.exemple = false; c.updatedAt = Date.now(); return [c, ...a]; }),
    removeSession: (id) => {
      const s = seances.find((x) => x.id === id); const idx = seances.findIndex((x) => x.id === id); const prevCarnet = carnet;
      setSeances((a) => a.filter((x) => x.id !== id));
      if (carnet) setCarnet((c) => ({ ...c, slots: c.slots.map((sl) => (sl.seanceId === id ? { ...sl, seanceId: null } : sl)) }));
      toast('Séance supprimée', { label: 'Annuler', run: () => { setSeances((a) => { const b = a.slice(); b.splice(idx, 0, s); return b; }); setCarnet(prevCarnet); setToastMsg(null); } });
    },
    loadExample: () => { const ex = buildExample(); setSeances((a) => [...ex.seances, ...a]); setCarnet(ex.carnet); location.hash = 'carnet'; toast('Exemple chargé : 10 séances dans le carnet'); },
    createCarnet: (titre, examDate) => {
      const start = isoPlus(examDate, -150);
      setCarnet({ titre: titre || 'Carnet IE', examDate, synthese: '', slots: Array.from({ length: 10 }, (_, i) => ({ date: isoPlus(start, Math.round((i * 130) / 9)), seanceId: null })) });
    },
    deleteCarnet: () => { setCarnet(null); toast('Carnet supprimé, tes séances sont conservées'); },
    setCarnet: (patch) => setCarnet((c) => ({ ...c, ...patch })),
    setSlot: (i, patch) => setCarnet((c) => ({ ...c, slots: c.slots.map((sl, k) => (k === i ? { ...sl, ...patch } : sl)) })),
    swapSlot: (i, j) => setCarnet((c) => { const s = c.slots.map((x) => ({ ...x })); const t = s[i].seanceId; s[i].seanceId = s[j].seanceId; s[j].seanceId = t; return { ...c, slots: s }; }),
    resetAll: () => { setSeances([]); setCarnet(null); setPrefs({}); toast('Données effacées'); },
  };
  const onBack = (s) => { if (isEmptySession(s)) { setSeances((a) => a.filter((x) => x.id !== s.id)); setCarnet((c) => (c ? { ...c, slots: c.slots.map((sl) => (sl.seanceId === s.id ? { ...sl, seanceId: null } : sl)) } : c)); } setBuilding(null); };
  const accept = () => { store.set(DKEY, { v: DISCLAIMER_VERSION, at: Date.now() }); setDisclaimerOk(true); };
  const data = { seances, carnet, prefs, storageOk };

  if (building && seances.some((s) => s.id === building))
    return html`<${React.Fragment}><main className="mx-auto w-full max-w-[560px]"><${Builder} key=${building} data=${data} id=${building} actions=${actions} onBack=${onBack} /></main>
      ${!disclaimerOk && html`<${DisclaimerGate} onAccept=${accept} />`}<${Toast} t=${toastMsg} /><//>`;

  return html`<${React.Fragment}>
    <main className="mx-auto w-full max-w-[560px] pb-32">
      ${tab === 'seances' && html`<${Seances} data=${data} actions=${actions} />`}
      ${tab === 'carnet' && html`<${Carnet} data=${data} actions=${actions} />`}
      ${tab === 'exercices' && html`<${Catalogue} />`}
      ${tab === 'plus' && html`<${Plus} data=${data} actions=${actions} />`}</main>
    <nav aria-label="Navigation principale" className="fixed inset-x-0 bottom-0 z-40 bg-card border-t border-line" style=${{ paddingBottom: 'env(safe-area-inset-bottom,0px)', paddingLeft: 'max(8px,env(safe-area-inset-left,0px))', paddingRight: 'max(8px,env(safe-area-inset-right,0px))' }}>
      <ul className="mx-auto max-w-[560px] grid grid-cols-4">${TABS.map(([k, l, ic]) => { const Ic = I[ic]; return html`<li key=${k}><a href=${'#' + k} aria-current=${tab === k ? 'page' : undefined} className=${cx('flex flex-col items-center gap-1 py-2.5 min-h-[60px] font-semibold text-[12px]', tab === k ? 'text-ink' : 'text-mute')}>
        <span className=${cx('rounded-full px-5 py-1', tab === k ? 'bg-primary text-on-primary' : '')}><${Ic} size=${20} aria-hidden="true" /></span>${l}</a></li>`; })}</ul></nav>
    ${!disclaimerOk && html`<${DisclaimerGate} onAccept=${accept} />`}<${Toast} t=${toastMsg} /><//>`;
}

function Toast({ t }) {
  if (!t) return null;
  return html`<div className="fixed inset-x-0 z-[70] flex justify-center px-4 pointer-events-none" style=${{ bottom: 'calc(84px + env(safe-area-inset-bottom,0px))' }} role="status">
    <div className="rise pointer-events-auto bg-ink text-bg rounded-2xl px-5 py-3 flex items-center gap-4 max-w-[480px] shadow-lg"><span className="text-[15px]">${t.msg}</span>
      ${t.action && html`<button type="button" className="font-semibold underline text-primary" onClick=${t.action.run}>${t.action.label}</button>`}</div></div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>

</body></html>
